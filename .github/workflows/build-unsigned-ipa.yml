name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (CMake + Xcode)
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -project build/je2be-ios.xcodeproj \
            -scheme je2be-ios \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/je2be-ios.app build/Payload/
          (
            cd build
            /usr/bin/zip -qry je2be-ios-unsigned.ipa Payload
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: je2be-ios-unsigned-ipa
          path: build/je2be-ios-unsigned.ipa
